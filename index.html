<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ぞろぞろうーちー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#bfe6da; --milk:#fffaf1; --ink:#4b3527; --ink-soft:#7d6656;
  --berry:#ef8fb0; --cream:#ffd45c; --panel:rgba(255,250,241,.94); --panel-line:#ead9c2;
  --btn:#4b3527; --btn-ink:#fffaf1;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --panel:rgba(58,44,36,.94); --panel-line:#5d4838; --ink:#fff1df; --ink-soft:#d9c3ad; --btn:#ffd45c; --btn-ink:#3a2c24; }
}
:root[data-theme="dark"]{ --panel:rgba(58,44,36,.94); --panel-line:#5d4838; --ink:#fff1df; --ink-soft:#d9c3ad; --btn:#ffd45c; --btn-ink:#3a2c24; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0; height:100%; overflow:hidden; background:var(--sky); touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
body{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif; color:var(--ink)}
#stage{position:fixed; inset:0}
canvas{display:block; width:100%; height:100%}
.hud{position:fixed; left:0; right:0; top:0; padding:calc(env(safe-area-inset-top,0px) + 8px) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px)); display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:start; gap:6px 6px; pointer-events:none; box-sizing:border-box}
.pill{background:var(--panel); border:2px solid var(--panel-line); border-radius:999px; padding:6px 14px; font-weight:800; font-size:15px; line-height:1.2; white-space:nowrap}
#stagePill{justify-self:start; max-width:100%; white-space:normal; font-size:11px; line-height:1.25; padding:5px 10px; border-radius:16px; box-sizing:border-box}
#stagePill small{display:block; font-size:9px; margin:0}
#time{justify-self:center; padding:4px 12px}
#mute{justify-self:end; padding:7px 12px}
.hrow2{grid-column:1/-1; display:flex; justify-content:center; gap:6px; min-width:0}
#pow{align-items:center; gap:5px; padding:5px 11px; font-size:13px; min-width:0}
#pow small{margin-right:0}
#pow .bar{display:inline-block; position:relative; width:56px; height:8px; border-radius:4px; background:rgba(140,120,110,.3); overflow:hidden; flex:none}
#pow .bar span{position:absolute; left:0; top:0; bottom:0; width:0; border-radius:4px}
#powLive{background:rgba(255,214,120,.45)} #powFill{background:#f2b84b}
#pow.full #powFill{background:linear-gradient(90deg,#ffd76a,#fff3c4,#ffd76a)} #pow.full{border-color:#f2b84b}
#powPlus{color:#e0a83a; font-size:11px}
.pill small{font-weight:500; font-size:11px; color:var(--ink-soft); margin-right:4px}
#count{font-size:18px; padding:4px 13px}
#count .fld{font-size:13px; color:var(--ink-soft); margin-left:2px}
#count.bump{animation:bump .25s ease-out}
#count.drop{animation:drop .35s ease-out}
@keyframes bump{40%{transform:scale(1.18)}}
@keyframes drop{30%{transform:translateX(-4px); color:#d0466e}60%{transform:translateX(4px)}}
#time{pointer-events:auto; cursor:pointer; font-size:26px; padding:4px 16px; font:inherit; font-weight:800; color:inherit}
#time small{font-size:11px}
#time .ps{display:block; font-size:9px; font-weight:500; color:var(--ink-soft); margin-top:-2px}
#time.low{color:#d0466e; border-color:#d0466e; animation:tick .5s ease-in-out infinite alternate}
@keyframes tick{to{transform:scale(1.08)}}
.right{display:flex; gap:6px; align-items:flex-start; pointer-events:auto}
#mute{pointer-events:auto; cursor:pointer; font:inherit; color:inherit}
#line{position:fixed; right:calc(18px + env(safe-area-inset-right,0px)); bottom:calc(22px + env(safe-area-inset-bottom,0px)); width:86px; height:86px; border-radius:50%; border:3px solid var(--panel-line); background:var(--panel); color:var(--ink); font:800 17px/1 inherit; font-family:inherit; display:none; touch-action:none; cursor:pointer}
#line.on{background:var(--cream); color:#4b3527; transform:scale(.94)}
#line span{display:block; font-weight:500; font-size:10px; margin-top:4px; color:inherit; opacity:.7}
#joy{position:fixed; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:50%; border:3px solid rgba(255,255,255,.8); background:rgba(255,255,255,.18); display:none; pointer-events:none}
#knob{position:absolute; left:50%; top:50%; width:50px; height:50px; margin:-25px 0 0 -25px; border-radius:50%; background:rgba(255,255,255,.9); box-shadow:0 2px 0 rgba(75,53,39,.25)}
.overlay{position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 20px); background:rgba(191,230,218,.35); touch-action:auto}
.overlay.show{display:flex}
#titleLogo{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:none; cursor:default; transition:transform .3s}
#titleLogo.hold{transform:scale(.97)}
.card{background:var(--panel); border:2px solid var(--panel-line); border-radius:28px; padding:26px 24px 22px; width:min(360px,100%); text-align:center}
h1{margin:0; font-weight:800; font-size:clamp(34px,10vw,48px); line-height:1.05; letter-spacing:.02em}
h1 .zoro{display:block; font-size:.62em; color:var(--berry); letter-spacing:.18em}
h2{margin:0 0 6px; font-size:28px; font-weight:800}
.lead{margin:14px 0 18px; font-size:15px; line-height:1.7}
.rules{margin:0 0 20px; padding:0; list-style:none; font-size:14px; line-height:1.6; text-align:left; display:grid; gap:6px}
.rules li{display:flex; gap:10px; align-items:baseline}
.rules b{flex:0 0 5.2em; font-weight:800}
.score-line{font-size:17px; margin:6px 0}
.big{font-size:44px; font-weight:800; line-height:1.1; margin:6px 0 4px}
.muted{color:var(--ink-soft); font-size:13px; margin:2px 0}
.btns{display:flex; flex-direction:column; gap:10px; margin-top:18px}
button.main{font:800 18px/1 inherit; font-family:inherit; padding:16px; border-radius:999px; border:0; background:var(--btn); color:var(--btn-ink); cursor:pointer}
button.sub{font:800 15px/1 inherit; font-family:inherit; padding:12px; border-radius:999px; border:2px solid var(--panel-line); background:transparent; color:var(--ink); cursor:pointer}
button:focus-visible{outline:3px solid var(--berry); outline-offset:3px}
#talk{position:fixed; inset:0; pointer-events:none; overflow:hidden}
.bub{position:absolute; left:0; top:0; padding:3px 8px 4px; border-radius:10px; background:#fffaf1; color:#4b3527; border:2px solid #4b3527; font-weight:800; font-size:12px; line-height:1.2; white-space:nowrap; opacity:0; will-change:transform}
.bub::after{content:""; position:absolute; left:50%; bottom:-6px; margin-left:-4px; border:4px solid transparent; border-top-color:#4b3527; border-bottom:0}
.bub.hero{font-size:13px; white-space:normal; width:max-content; max-width:220px; text-align:center; border-color:#d9a400; background:#fffbe8; z-index:2; padding:5px 10px 6px}
.bub.hero::after{border-top-color:#d9a400}
.bub.hot{background:#ffe3ec; border-color:#c93d68; color:#a3254f}
.bub.hot::after{border-top-color:#c93d68}
#caption{white-space:pre-line; position:fixed; left:50%; bottom:calc(60px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); width:min(340px,calc(100% - 32px)); background:rgba(36,20,52,.86); color:#fff4e6; border:2px solid #a04dff; border-radius:16px; padding:12px 16px; font-weight:800; font-size:16px; line-height:1.5; text-align:center; opacity:0; transition:opacity .4s; pointer-events:none}
#caption.show{opacity:1}
#prologOv{position:fixed; inset:0; display:none; z-index:20; background:radial-gradient(ellipse at 50% 40%,#3a1c5c 0%,#160a26 75%); color:#fff4e6; align-items:center; justify-content:center; padding:calc(env(safe-area-inset-top,0px) + 24px) 28px calc(env(safe-area-inset-bottom,0px) + 24px); cursor:pointer; -webkit-user-select:none; user-select:none}
#prologOv.show{display:flex}
#prologTxt{max-width:340px; font-size:19px; font-weight:800; line-height:1.9; text-align:center; opacity:0; transform:translateY(8px); transition:opacity .7s, transform .7s; white-space:pre-line}
#prologTxt.in{opacity:1; transform:none}
#prologTxt.cyber{color:#c99bff; text-shadow:0 0 10px #8a3dff,0 0 2px #4ff}
#prologTxt.warm{color:#ffe9a8; text-shadow:0 0 12px rgba(255,220,140,.6)}
#prologSkip{position:absolute; top:calc(env(safe-area-inset-top,0px) + 14px); right:14px; background:rgba(255,255,255,.12); color:#fff4e6; border:1.5px solid rgba(255,255,255,.35); border-radius:999px; padding:8px 16px; font:inherit; font-weight:800; font-size:14px}
#prologHint{position:absolute; bottom:calc(env(safe-area-inset-bottom,0px) + 22px); left:0; right:0; text-align:center; font-size:12px; opacity:.5}
#prologDots{position:absolute; bottom:calc(env(safe-area-inset-bottom,0px) + 44px); left:0; right:0; text-align:center; font-size:10px; letter-spacing:4px; opacity:.6}
#dropBtns{position:fixed; left:calc(14px + env(safe-area-inset-left,0px)); bottom:calc(26px + env(safe-area-inset-bottom,0px)); display:none; gap:8px}
#dropBtns button{width:58px; height:58px; border-radius:50%; border:3px solid var(--panel-line); background:var(--panel); color:var(--ink); font:800 15px/1 inherit; font-family:inherit; cursor:pointer; touch-action:manipulation}
#dropBtns button:active{transform:scale(.92)}
#dropBtns.full button{opacity:.45}
#freeTools{position:fixed; right:calc(16px + env(safe-area-inset-right,0px)); bottom:calc(124px + env(safe-area-inset-bottom,0px)); display:none; flex-direction:column; gap:8px}
#freeTools button{width:60px; height:60px; border-radius:50%; border:3px solid var(--panel-line); background:var(--panel); color:var(--ink); font-family:inherit; font-weight:800; cursor:pointer; touch-action:manipulation; display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.05; padding:0}
#freeTools button b{font-size:20px} #freeTools button span{font-size:9.5px; margin-top:2px; white-space:nowrap}
#freeTools button.on{border-color:#f2b84b; box-shadow:0 0 0 3px rgba(242,184,75,.35)}
#freeTools button.cy{border-color:#9b3dff; box-shadow:0 0 0 3px rgba(155,61,255,.35)}
#freeTools button:active{transform:scale(.92)}
body.photo #hud, body.photo #dropBtns, body.photo #line, body.photo #freeTools button:not(#ftPhoto), body.photo #joy{visibility:hidden}
#photoHint{position:fixed; left:0; right:0; top:calc(env(safe-area-inset-top,0px) + 16px); text-align:center; font-size:13px; font-weight:800; color:#fffaf1; text-shadow:0 1px 3px rgba(0,0,0,.5); pointer-events:none; opacity:0; transition:opacity .5s}
body.photo #photoHint{opacity:1}
.dgrid{display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:6px}
.dgrid3{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:6px}
.dgrid button,.dgrid3 button{padding:10px 0; font-size:14px}
button.dbg{border-style:dashed; opacity:.75}
#banner{position:fixed; left:0; right:0; top:38%; text-align:center; font-weight:800; font-size:34px; color:#fffaf1; text-shadow:0 3px 0 rgba(75,53,39,.45); pointer-events:none; display:none}
#banner small{display:block; font-size:16px; margin-bottom:4px}
.kbd{display:none}
@media (hover:hover) and (pointer:fine){ .kbd{display:block} }
@media (prefers-reduced-motion: reduce){ #count.bump,#count.drop{animation:none} }
</style>
</head>
<body>
<div id="stage"></div>
<div class="hud" id="hud" style="display:none">
  <div class="pill" id="stagePill">1</div>
  <button class="pill" id="time" aria-label="タイム（一時停止）"><small>のこり</small><span id="timeN">60</span><span class="ps">タップでタイム</span></button>
  <button class="pill" id="mute" aria-label="音を切りかえる">♪</button>
  <div class="hrow2">
    <div class="pill" id="count"><small>なかま</small><span id="countN">0</span></div>
    <div class="pill" id="pow" style="display:none"><small>浄化</small><b id="powN">0</b><span id="powPlus"></span><span class="bar"><span id="powLive"></span><span id="powFill"></span></span></div>
  </div>
</div>
<div id="freeTools"><button id="ftBoss"><b>🐮</b><span>スプカウ</span></button><button id="ftRing"><b>⭕</b><span>わっか</span></button><button id="ftJump"><b>⤴</b><span>ジャンプ</span></button><button id="ftPhoto"><b>📷</b><span>さつえい</span></button></div>
<div id="photoHint">ドラッグでまわす・ピンチでズーム</div>
<div id="dropBtns"><button data-n="1">+1</button><button data-n="10">+10</button><button data-n="100">+100</button></div>
<div id="joy"><div id="knob"></div></div>
<button id="line" aria-label="長押しで集合">あつまれ<span>長押し</span></button>
<div id="talk"></div>
<div id="caption"></div>
<div id="err" style="display:none;position:fixed;left:12px;right:12px;bottom:120px;background:#fff;color:#a3254f;border:2px solid #a3254f;border-radius:12px;padding:8px 10px;font-size:12px;z-index:9;pointer-events:none"></div>
<div id="banner"></div>
<div id="prologOv"><button id="prologSkip">スキップ ▶▶</button><div id="prologTxt"></div><div id="prologDots"></div><div id="prologHint">タップでつぎへ</div></div>

<div class="overlay show" id="titleOv">
  <div class="card">
    <h1 id="titleLogo"><span class="zoro">ぞろぞろ</span>うーちー</h1>
    <p class="lead">王冠のうーちーを動かして、<br>なかまをゴールまで連れていこう。<br>くわしくはうーちーが教えるモー。</p>
    <p class="muted">ドラッグでうごく</p>
    <p class="muted kbd">キーボード：矢印キー／スペースで集合</p>
    <p class="muted" id="bestTitle"></p>
    <div class="btns">
      <button class="main" id="startBtn">ストーリー</button>
      <button class="sub" id="endlessBtn">エンドレス</button>
      <button class="sub" id="freeBtn">じゆうモード</button>
      <button class="sub dbg" id="debugBtn" style="display:none">デバッグ（仮）</button>
    </div>
  </div>
</div>

<div class="overlay" id="resultOv">
  <div class="card">
    <h2 id="resTitle">ゴール！</h2>
    <p class="score-line" id="resFormula"></p>
    <p class="big" id="resScore">0</p>
    <p class="muted" id="resFell"></p>
    <p class="muted" id="resTotal"></p>
    <p class="muted" id="resAuto"></p>
    <div class="btns" id="resBtns">
      <button class="main" id="nextBtn">つぎのステージ</button>
      <button class="sub" id="retryBtn">もういちど</button>
    </div>
  </div>
</div>

<div class="overlay" id="startOv">
  <div class="card">
    <p class="muted" id="stNum">ステージ 1</p>
    <h2 id="stName">さんぽみち</h2>
    <p class="muted" id="stInfo"></p>
    <div class="btns"><button class="main" id="stBtn">ステージ1 スタート</button></div>
  </div>
</div>

<div class="overlay" id="pauseOv">
  <div class="card">
    <h2>タイム</h2>
    <p class="muted">ひと休み中</p>
    <div class="btns">
      <button class="main" id="resumeBtn">つづける</button>
      <button class="sub" id="pauseRetry">このステージをやりなおす</button>
      <button class="sub" id="pauseMenu">メニューへ</button>
    </div>
  </div>
</div>

<div class="overlay" id="overOv">
  <div class="card">
    <h2 id="overTitle">ゲームオーバー</h2>
    <p class="lead" id="overLead">王冠のうーちーが<br>電脳スプカウにつかまった</p>
    <div class="btns"><button class="main" id="overBtn">このステージから</button><button class="sub" id="overMenu">メニューへ</button></div>
  </div>
</div>

<div class="overlay" id="debugOv">
  <div class="card">
    <h2>デバッグ</h2>
    <p class="muted">ステージをえらぶ</p>
    <div class="dgrid" id="dbgStages"></div>
    <p class="muted" style="margin-top:14px">最終面を救出数つきで遊ぶ</p>
    <div class="dgrid3"><button class="sub" data-end="0">脱出</button><button class="sub" data-end="1">おやすみ</button><button class="sub" data-end="2">おかえり</button></div>
    <div class="btns"><button class="sub" id="dbgClose">もどる</button></div>
  </div>
</div>

<div class="overlay" id="finalOv">
  <div class="card">
    <p class="muted" id="endLabel">ENDING</p>
    <h2 id="endName">ぜんぶクリア</h2>
    <div id="finalList" class="muted" style="line-height:1.9;margin:8px 0"></div>
    <p class="score-line">トータル</p>
    <p class="big" id="finalScore">0</p>
    <p class="muted" id="finalBest"></p>
    <p class="muted" id="endHint"></p>
    <div class="btns"><button class="main" id="againBtn">さいしょから</button><button class="sub" id="finalMenu">メニューへ</button></div>
  </div>
</div>

<script>
(function(){
"use strict";

const $=id=>document.getElementById(id);

/* ---------- three setup ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
$('stage').appendChild(renderer.domElement);
const scene=new THREE.Scene();
const SKY=0xbfe6da;
scene.background=new THREE.Color(SKY);
scene.fog=new THREE.Fog(SKY,26,60);
const camera=new THREE.PerspectiveCamera(48,1,0.1,200);
scene.add(new THREE.HemisphereLight(0xffffff,0xd9c6a8,0.95));
const sun=new THREE.DirectionalLight(0xffffff,0.55); sun.position.set(4,10,6); scene.add(sun);

const tex=new THREE.TextureLoader().load(TEX);
tex.flipY=false; tex.encoding=THREE.sRGBEncoding;
const uuMat=new THREE.MeshLambertMaterial({map:tex}), legMat=new THREE.MeshLambertMaterial({map:tex}), heroMat=new THREE.MeshLambertMaterial({map:tex});

function partGeo(p){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(p.pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(p.nor,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(p.uv,2));
  g.setIndex(p.idx); return g;
}
const byName={}; MODEL.forEach(p=>byName[p.n]=p);
function worldT(p){const t=p.t.slice(); if(p.p){const q=byName[p.p]; t[0]+=q.t[0];t[1]+=q.t[1];t[2]+=q.t[2];} return t;}

// merged geometry for the crowd
function mergedGeo(skip){
  const pos=[],nor=[],uv=[],idx=[]; let base=0;
  MODEL.forEach(p=>{if(skip&&skip.includes(p.n))return; const t=worldT(p);
    for(let i=0;i<p.pos.length;i+=3){pos.push(p.pos[i]+t[0],p.pos[i+1]+t[1],p.pos[i+2]+t[2]);}
    nor.push(...p.nor); uv.push(...p.uv); p.idx.forEach(k=>idx.push(k+base)); base+=p.pos.length/3;});
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx); return g;
}
const crowd=new THREE.InstancedMesh(mergedGeo(['legL','legR']),uuMat,CAP);
for(let i=0;i<CAP;i++)crowd.setColorAt(i,new THREE.Color(1,1,1));

const legT={L:byName.legL.t,R:byName.legR.t};
const legsL=new THREE.InstancedMesh(partGeo(byName.legL),legMat,CAP), legsR=new THREE.InstancedMesh(partGeo(byName.legR),legMat,CAP);
for(let i=0;i<CAP;i++){legsL.setColorAt(i,new THREE.Color(1,1,1));legsR.setColorAt(i,new THREE.Color(1,1,1));}
[legsL,legsR].forEach(m=>{m.frustumCulled=false; m.instanceMatrix.setUsage(THREE.DynamicDrawUsage); scene.add(m);});
const lm4=new THREE.Matrix4(), off4=new THREE.Matrix4();
function setLeg(mesh,i,base,T,lift,swing){off4.makeTranslation(T[0],T[1]+lift,T[2]+swing); lm4.multiplyMatrices(base,off4); mesh.setMatrixAt(i,lm4);}

const shadows=new THREE.InstancedMesh(new THREE.CircleGeometry(1,12).rotateX(-Math.PI/2),shadowMat,CAP+1);
shadows.frustumCulled=false; shadows.renderOrder=1; scene.add(shadows);

// hero: articulated parts + crown + ring
const hero=new THREE.Group(); const heroParts={};

      const c2=Math.floor(R()*(W-w)), a=Math.min(c,c2), b=Math.max(c,c2)+w-1;
      for(let rr=r;rr>r-w;rr--)for(let cc=a;cc<=b;cc++)set(rr,cc);
      if(R()<0.75){const dir=c2>=c?-1:1, len=2+Math.floor(R()*4); let end=null; const st=dir<0?a-1:b+1;
        for(let k=0;k<len;k++){const cc=st+dir*k; if(cc<0||cc>=W||g[r][cc]!==' ')break; set(r,cc); end=cc; pocketLen++;}
        if(end!==null){const q=R(); put(r,end,q<0.4?'u':q<0.8?'U':'W');}}
      if(R()<0.35){const cc=a+Math.floor(R()*(b-a+1)); if(g[r][cc]==='.')put(r,cc,'u');}
      c=c2; r-=w;
    }
    while(r>1){set(r,c);set(r,c+1); r--;}
    const gc=Math.max(0,Math.min(W-3,c-1)); for(let rr=0;rr<2;rr++)for(let cc=gc;cc<gc+3;cc++)put(rr,cc,'G');
    if(walls)for(let rr=0;rr<H;rr++)for(let cc=0;cc<W;cc++)if(g[rr][cc]===' ')g[rr][cc]='#';
    // validate
    const bfs=(open)=>{const S0=[];for(let rr=0;rr<H;rr++)for(let cc=0;cc<W;cc++)if(g[rr][cc]==='S')S0.push([rr,cc]);
      const seen=new Set([S0[0].join()]), q=[S0[0]], dist={}; dist[S0[0].join()]=0;
      while(q.length){const [a1,b1]=q.shift(); for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){const nr=a1+dr,nc=b1+dc; if(nr<0||nc<0||nr>=H||nc>=W)continue; const ch=g[nr][nc]; if(ch===' '||ch==='#'||(ch==='D'&&!open))continue; const k=nr+','+nc; if(seen.has(k))continue; seen.add(k); dist[k]=dist[a1+','+b1]+1; q.push([nr,nc]);}}
      return dist;};
    const dc=bfs(false), dopen=bfs(true);
    const has=(d,ch)=>Object.keys(d).some(k=>{const [a1,b1]=k.split(',').map(Number); return g[a1][b1]===ch;});
    const gd=d=>Math.min(...Object.keys(d).filter(k=>{const [a1,b1]=k.split(',').map(Number); return g[a1][b1]==='G';}).map(k=>d[k]));
    if(hub){ if(has(dc,'G')||!has(dc,'K')||!has(dopen,'G'))continue; }
    else if(!has(dc,'G'))continue;
    const req=gd(dopen)+(hub?12:0), tall=(req+pocketLen*2+6)*CELL/HERO_SPEED;
    const factor=Math.max(1.3,2.6-0.12*(L-1));
    const stage={name:'エンドレス '+L,time:Math.max(14,Math.ceil(tall*factor)),map:g.map(row=>row.join('')),push,endless:true,mult:+(1+0.15*(L-1)).toFixed(2)};
    const boss=L<=2?{mode:'none'}:L===3?{mode:'watch'}:{mode:'chase',sp:Math.min(3.2,1.9+0.1*(L-4)),delay:Math.max(1.2,2.6-0.1*(L-4))};
    return {stage,boss};
  }
  return {stage:Object.assign({},STAGES[1],{name:'エンドレス '+L,endless:true,mult:1+0.15*(L-1)}),boss:{mode:'none'}};
}

const sfx=(function(){let ac=null,muted=false,master=null,humG=null;
  let bgmT=null,bgmNext=0,bgmStep=0,bgmRate=1;
  const MEL=[0,4,7,4, 9,7,4,2, 0,2,4,7, 4,2,0,-99, 2,4,9,7, 4,2,4,7, 9,12,9,7, 4,2,0,-99];
  const BAS=[0,0,0,0,-3,-3,-3,-3,5,5,5,5,7,7,7,7];
  function sched(){ if(!ac)return; const stepDur=0.25/bgmRate;
    while(bgmNext<ac.currentTime+0.12){ const i=bgmStep%32;
      if(!muted){ if(MEL[i]>-50)note(523.25*Math.pow(2,MEL[i]/12),bgmNext,stepDur*0.9,'triangle',0.045);
        if(i%2===0)note(130.81*Math.pow(2,BAS[(i/2)|0]/12),bgmNext,stepDur*1.6,'sine',0.07);
        if(i%4===2)note(2400,bgmNext,0.03,'square',0.012);}
      bgmNext+=stepDur; bgmStep++;}}
  function note(f,t,dur,type,vol){const o=ac.createOscillator(),g=ac.createGain(); o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02);}
  function init(){if(ac){if(ac.state==='suspended')ac.resume();return;} try{ac=new (window.AudioContext||window.webkitAudioContext)(); master=ac.createGain(); master.gain.value=0.5; master.connect(ac.destination);}catch(e){ac=null;}}
  function tone(f,dur,type,vol,f2,delay){if(!ac||muted)return; const t=ac.currentTime+(delay||0);
    const o=ac.createOscillator(),g=ac.createGain(); o.type=type||'triangle'; o.frequency.setValueAtTime(f,t); if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02);}
  let lastJoin=0;
  return {init,
    join(n){if(!ac)return; const now=ac.currentTime; if(now-lastJoin<0.03)return; lastJoin=now; tone(Math.min(1400,480+n*14),0.09,'triangle',0.18,Math.min(1800,620+n*16));},
    fall(){tone(760,0.45,'sine',0.16,180);},
    pon(n){tone(Math.min(1600,520+n*18),0.07,'square',0.06);},
    goal(){[523,659,784].forEach((f,i)=>tone(f,0.14,'triangle',0.16,0,i*0.08));},
    fanfare(){[659,784,988,1319].forEach((f,i)=>tone(f,0.2,'triangle',0.15,0,i*0.1));},
    zap(){tone(180,0.25,'square',0.07,1500); tone(1300,0.22,'sawtooth',0.04,90,0.04);},
    hum(level){if(!ac)return; if(!humG){humG=ac.createGain(); humG.gain.value=0; const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=380;
        [46,69.5].forEach(f=>{const o=ac.createOscillator(); o.type='sawtooth'; o.frequency.value=f; o.connect(lp); o.start();}); lp.connect(humG); humG.connect(master);}
      humG.gain.setTargetAtTime(muted?0:level*level*0.22,ac.currentTime,0.15);},
    beep(long){tone(long?1320:1760,long?0.45:0.09,'square',0.09);},
    bgmStart(){if(!ac||bgmT)return; bgmNext=ac.currentTime+0.1; bgmStep=0; bgmT=setInterval(sched,25);},
    bgmStop(){if(bgmT){clearInterval(bgmT);bgmT=null;}},
    bgmFast(f){bgmRate=f?1.6:1;},
    toggle(){muted=!muted;return muted;}};})();
